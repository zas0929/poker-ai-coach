<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101719"><title>Poker AI Coach</title><link rel="icon" href="/icons/icon.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101719;color:#f2f5ef;font:16px/1.6 Arial,sans-serif}main{width:min(440px,100%);text-align:center}img{width:88px;height:88px;border-radius:20px}h1{font-size:24px;line-height:1.25;margin:24px 0 12px}p{color:#aec0b3;margin:0 0 24px}button{font:inherit;border:1px solid #d6c078;border-radius:10px;padding:12px 20px;color:#f2f5ef;background:#25342e;cursor:pointer}button:focus-visible{outline:2px solid #d6c078;outline-offset:4px}.brand{font-size:14px;color:#d6c078;margin:14px 0 24px}
</style></head><body><main><img src="/icons/icon-192.png" alt=""><div class="brand">Poker AI Coach</div><h1 id="title">Нет подключения</h1><p id="message">Для тренировки и игры с друзьями нужен интернет. Подключитесь к сети и попробуйте снова.</p><button id="retry" type="button">Повторить подключение</button></main><script>
const text={ru:['Нет подключения','Для тренировки и игры с друзьями нужен интернет. Подключитесь к сети и попробуйте снова.','Повторить подключение'],uk:['Немає підключення','Для тренування та гри з друзями потрібен інтернет. Підключіться до мережі та спробуйте знову.','Повторити підключення'],en:['You are offline','Training and games with friends need an internet connection. Reconnect and try again.','Try connecting again']};
let language='ru';try{language=localStorage.getItem('poker-language')||language}catch{}
const selected=text[language]||text.ru;document.documentElement.lang=text[language]?language:'ru';['title','message','retry'].forEach((id,i)=>{document.getElementById(id).textContent=selected[i]});document.getElementById('retry').addEventListener('click',()=>location.reload());
</script></body></html>
